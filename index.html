function startTimer(){

if(running) return;

document.getElementById("timerDisplay").textContent = "0.00";

running = true;
startTime = Date.now();

timerInterval = setInterval(function(){

let elapsed = (Date.now() - startTime) / 1000;

document.getElementById("timerDisplay").textContent =
formatTime(elapsed);

}, 10);

}

function stopTimer(){

if(!running) return;

running = false;

clearInterval(timerInterval);

}

function resetTimer(){

clearInterval(timerInterval);

running = false;

document.getElementById("timerDisplay").textContent = "0.00";

}

document.addEventListener("keydown", function(event) {

    if (event.code === "Space") {

        event.preventDefault();

        toggleTimer();

    }

});


function toggleTimer(){

    if(running){
        stopTimer();
    } else {
        startTimer();
    }

}

function copyTime(){

    let time = document.getElementById("timerDisplay").textContent;

    navigator.clipboard.writeText(time);

}


function addTwo(){

    let display = document.getElementById("timerDisplay");

    if(display.textContent === "DNF") return;

    let parts = display.textContent.split(":");

    let time;

    if(parts.length === 2){
        time = parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
    } else {
        time = parseFloat(parts[0]);
    }

    time += 2;

    display.textContent = formatTime(time);

}


function setDNF(){

    document.getElementById("timerDisplay").textContent = "DNF";

}


function formatTime(seconds){

    let minutes = Math.floor(seconds / 60);
    let remainingSeconds = seconds % 60;

    if(minutes > 0){
        return minutes + ":" + remainingSeconds.toFixed(2).padStart(5, "0");
    }

    return remainingSeconds.toFixed(2);
}

function newScramble(){

    let cube = document.getElementById("cubeSelect").value;

    let moves;
    let length;

    if(cube === "2x2"){

        moves = ["R", "U", "F"];
        length = 11;

    }

    else if(cube === "3x3"){

        moves = ["R", "L", "U", "D", "F", "B"];
        length = 20;

    }

    else if(cube === "4x4"){

        moves = [
            "R", "L",
            "U", "D",
            "F", "B",
            "Rw", "Lw",
            "Uw", "Dw",
            "Fw", "Bw"
        ];

        length = 40;
    }


    let modifiers = ["", "'", "2"];

    let scramble = [];

    let lastAxis = "";


    function getAxis(move){

        if(move === "R" || move === "L" ||
           move === "Rw" || move === "Lw"){

            return "RL";

        }

        if(move === "U" || move === "D" ||
           move === "Uw" || move === "Dw"){

            return "UD";

        }

        if(move === "F" || move === "B" ||
           move === "Fw" || move === "Bw"){

            return "FB";

        }

    }


    for(let i = 0; i < length; i++){

        let move;
        let axis;

        do{

            move = moves[Math.floor(Math.random() * moves.length)];

            axis = getAxis(move);

        }while(axis === lastAxis);


        let modifier =
            modifiers[Math.floor(Math.random() * modifiers.length)];


        scramble.push(move + modifier);

        lastAxis = axis;

    }


    document.getElementById("scramble").textContent =
        scramble.join(" ");

}

function copyScramble(){

    let scramble = document.getElementById("scramble").textContent;

    navigator.clipboard.writeText(scramble);

}
